[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nex-codex"
version = "1.0.0"
description = "Components V2 Discord bot with persistent bot registration and moderation"
requires-python = ">=3.12"
dependencies = ["discord.py==2.6.4", "aiohttp==3.14.5", "aiosqlite==0.21.0", "python-dotenv==1.1.1"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "pytest-asyncio==1.2.0", "ruff==0.14.2"]

[project.scripts]
nex-codex = "nex.bot:main"

[tool.setuptools.packages.find]
include = ["nex*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
